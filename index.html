<style>
body{margin:0;background:#0e1712;color:#e9f1eb;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}p{color:#93ab9d;font-size:14px;margin:0 0 18px}
.card{background:#1a2a20;border:1px solid #2a3d31;border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px}
b{color:#7ed08a}
</style>

<body>
<h1>Mendro Scavenger Hunt</h1>
<p>Stub build — pipeline test</p>
<div class="card" id="s">Checking browser storage…</div>
<div class="card">If you can read this on your phone, GitHub Pages and the home-screen icon both work.</div>
<script>
const el = document.getElementById('s');
const req = indexedDB.open('mendro-test', 1);
req.onupgradeneeded = () => req.result.createObjectStore('x');
req.onsuccess = () => el.innerHTML = 'IndexedDB: <b>OK</b>';
req.onerror = () => el.innerHTML = 'IndexedDB: <b>blocked</b> (private browsing?)';
</script>
</body>
