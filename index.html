<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mendro SY Hunt">
<meta name="theme-color" content="#0e1712">
<title>Mendro Scavenger Hunt</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="titles">
    <div>
      <h1>Mendro Scavenger Hunt</h1>
      <div class="counts" id="counts">Loading&hellip;</div>
    </div>
    <span class="pct" id="pct">0%</span>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="P">&#127807; Plants</button>
    <button class="chip" data-f="I">&#129419; Insects</button>
    <button class="chip" data-f="M">&#129412; Mammals</button>
    <button class="chip" data-f="B">&#128038; Birds</button>
    <button class="chip" data-f="H">&#129422; Herps</button>
    <button class="chip" data-f="found">&#10003; Found</button>
  </div>
  <div class="sw">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Search species or note" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
</header>
<ul id="list"></ul>
<div id="status">Photos are saved on this device only.</div>
<div id="lb" hidden>
  <div class="lbtop">
    <button class="lbx" id="lbx" aria-label="Close">&#10005;</button>
    <div id="cap"></div>
  </div>
  <div id="stage"><img id="lbImg" alt=""></div>
  <div class="hint">Pinch or double-tap to zoom</div>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<div id="toast"></div>
<script src="data.js" defer></script>
<script src="app.js?v=2" defer></script>
</body>
</html>
